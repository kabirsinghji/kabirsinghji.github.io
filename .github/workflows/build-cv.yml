name: Build CV and homepage

# data/cv.json is the single source for the CV. Any change to it (usually a
# save from admin.html) regenerates every CV profile (cv/cv.* and cv/cv-ID.*:
# .tex, .docx, .txt) and the site pages, compiles each .tex to a PDF, and
# commits them back.
on:
  push:
    paths:
      - 'data/cv.json'
      - 'tools/build.py'
      - 'tools/linkedin.py'
      - 'cv/preamble.tex'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the branch as it is now, not the commit that started this run: a build queued
          # behind another (two quick saves) then includes that build's commit and can push
          ref: ${{ github.ref_name }}

      - name: Read the LinkedIn posts listed in data/cv.json (never fails the build)
        run: python3 tools/linkedin.py

      - name: Generate the CVs (.tex, .docx, .txt per profile) and the site pages from data/cv.json
        run: python3 tools/build.py

      - name: Compile every CV profile to PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv
          root_file: cv*.tex

      - name: Commit the rebuilt files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A also records CVs removed when a profile is deleted; LaTeX's .aux/.log files stay out
          git add -A -- 'cv/cv*.tex' 'cv/cv*.pdf' 'cv/cv*.docx' 'cv/cv*.txt'
          git add index.html cv.html curious.html home-*.html
          if [ -f data/linkedin.json ]; then git add data/linkedin.json; fi
          if [ -d linkedin ]; then git add -A linkedin; fi
          git diff --staged --quiet && exit 0
          git commit -m "Rebuild CV and homepage from data/cv.json"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
