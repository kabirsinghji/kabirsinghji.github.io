<script>
/* Lists whatever image files are in the escapades/ folder of the repo, newest
   filename first, so adding a photo is just uploading it there. Uses the public
   GitHub API to read the folder; the images themselves load from this site. */
(function () {
  var REPO = 'kabirsinghji/kabirsinghji.github.io', DIR = 'escapades';
  var box = document.getElementById('photos'), status = document.getElementById('photos-status');
  var IMAGE = /\.(jpe?g|png|webp|gif|avif)$/i;
  function fromApi() {
    return fetch('https://api.github.com/repos/' + REPO + '/contents/' + DIR)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (items) {
        return items.filter(function (f) { return f.type === 'file' && IMAGE.test(f.name); })
                    .map(function (f) { return f.name; });
      });
  }
  function fromList() {                 /* optional escapades/photos.json: ["a.jpg", ...] */
    return fetch(DIR + '/photos.json').then(function (r) { if (!r.ok) throw 0; return r.json(); });
  }
  fromApi().catch(fromList)
    .then(function (names) {
      var photos = names.filter(function (n) { return IMAGE.test(n); })
                        .sort(function (a, b) { return a < b ? 1 : -1; })
                        .map(function (n) { return { name: n }; });
      if (!photos.length) { status.textContent = 'No photos yet.'; return; }
      status.remove();
      var grid = document.createElement('div'); grid.className = 'photo-grid';
      photos.forEach(function (f) {
        var a = document.createElement('a'); a.href = DIR + '/' + f.name;
        var img = document.createElement('img');
        img.src = DIR + '/' + f.name; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
        a.appendChild(img); grid.appendChild(a);
      });
      box.appendChild(grid);
    })
    .catch(function () {
      status.textContent = 'Could not fetch the photo list just now. Try again in a minute.';
    });
})();
</script>
